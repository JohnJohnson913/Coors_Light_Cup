/* SIDEBAR */

.sidebar{

    left:0;

}

.sidebar h2{

.hero{

    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;

    padding:20px;
}

.info h2{
    color:#003B7A;
    margin-bottom:15px;
}

footer{
    background:#00254d;
    color:white;
    text-align:center;
    padding:20px;
}

@media(max-width:900px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .content{
        width:100%;
        margin-left:0;
    }

    body{
        display:block;
    }
}
